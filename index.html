function play(n){const l=LS[n-1];Q={n,l,qs:sh(l.q),i:0,pts:0,ok:0,bad:0,rt:0,miss:[]};show()}
function show(){const l=Q.l,N=Q.qs.length;Q.att=0;Q.done=false;Q.cur=Q.qs[Q.i];
A.innerHTML=`<div class="top"><button class="sm" onclick="menu()">← Menu</button><b>${l.ic} ${l.th}</b></div><div class="bar"><i style="width:${Q.i/N*100}%;background:${l.c}"></i></div><p class="s">Question ${Q.i+1}/${N} · Worth 2 pts · Total ${Q.pts}/${N*2} · ✅ ${Q.ok} ❌ ${Q.bad}</p><div class="qc" style="border-color:${l.c}"><div id="qb"></div></div><div id="fb"></div><button class="btn" id="nx" style="display:none" onclick="nxt()">${Q.i+1<N?'Next ➜':'Finish 🏁'}</button>`;draw(Q.cur)}
function draw(q){const b=$('#qb');
if(q[0]=='m'){q.o=sh([q[2],...q[3]]);b.innerHTML=`<h2>${E(q[1])}</h2>`+q.o.map((o,i)=>`<button class="opt" onclick="pk(${i},this)"><b>${'ABCD'[i]}</b>${E(o)}</button>`).join('')}
else if(q[0]=='t')b.innerHTML=`<h2>True or False?</h2><div class="tfs">${E(q[1])}</div><button class="opt" onclick="tf(true,this)">✅ True</button><button class="opt" onclick="tf(false,this)">❌ False</button>`;
else if(q[0]=='x'){q.r=sh(q[1].map(p=>p[1]));b.innerHTML=`<h2>Match each item with its meaning</h2>`+q[1].map((p,i)=>`<div class="mr"><b>${E(p[0])}</b><select id="s${i}"><option value="">Choose…</option>${q.r.map(r=>`<option>${E(r)}</option>`).join('')}</select></div>`).join('')+`<button class="btn" onclick="chx()">Check ✔</button>`}
else{q.p=[];q.s=sh(q[2]);ro()}}
function pk(i,el){const q=Q.cur,ok=q.o[i]==q[2];if(Q.done)return;el.classList.add(ok?'ok':'no');el.disabled=true;res(ok,q[2])}
function tf(v,el){const q=Q.cur;if(Q.done)return;const ok=v===q[2];el.classList.add(ok?'ok':'no');el.disabled=true;res(ok,q[2]?'True':'False',q[3])}
function chx(){const q=Q.cur;let all=true,ok=true;q[1].forEach((p,i)=>{const v=$('#s'+i).value;if(!v)all=false;if(v!=p[1])ok=false});if(!all){toast('Match every item first');return}res(ok,q[1].map(p=>p[0]+' → '+p[1]).join(' | '))}
function ro(){const q=Q.cur;$('#qb').innerHTML=`<h2>${E(q[1])}</h2><p class="s">Tap the steps in the correct order:</p><ol class="ol">${q.p.map(x=>`<li>${E(x)}</li>`).join('')}</ol>`+q.s.filter(x=>!q.p.includes(x)).map(x=>`<button class="opt" data-v="${E(x)}" onclick="op(this.dataset.v)">${E(x)}</button>`).join('')+`<button class="sm" onclick="Q.cur.p=[];ro()">↺ Reset</button>`}
function op(v){const q=Q.cur;q.p.push(v);ro();if(q.p.length==q[2].length){const ok=q.p.every((x,i)=>x==q[2][i]);res(ok,q[2].map((x,i)=>(i+1)+'. '+x).join('  '))}}
function qt(q){return q[0]=='x'?'Matching: '+q[1].map(p=>p[0]).join(', '):q[1]}
function res(ok,ans,ex){if(Q.done)return;const f=$('#fb'),q=Q.cur;
if(ok){const p=Q.att?1:2;Q.pts+=p;Q.ok++;if(Q.att)Q.rt++;tone([660,880]);f.innerHTML=`<div class="fb g">🎉 ${p==2?'Excellent! +2 points':'Well done for trying again! +1 point'}</div>`;fin()}
else{Q.att++;if(Q.att<2){tone([180]);f.innerHTML=`<div class="fb r">💪 Not quite. Try again for 1 point!</div>`;if(q[0]=='o'){q.p=[];ro()}}
else{Q.bad++;Q.miss.push({q:qt(q),a:ans});tone([160,120]);f.innerHTML=`<div class="fb r">No points this time.<br><b>Correct answer:</b> ${E(ans)}${ex?'<br>💡 '+E(ex):''}</div>`;fin()}}}
function fin(){Q.done=true;const q=Q.cur;if(q[0]=='m')document.querySelectorAll('.opt').forEach((e,i)=>{if(q.o[i]==q[2])e.classList.add('ok')});document.querySelectorAll('#qb button,#qb select').forEach(e=>e.disabled=true);const n=$('#nx');n.style.display='block';n.scrollIntoView({behavior:'smooth',block:'center'})}
function nxt(){Q.i++;Q.i<Q.qs.length?show():finish()}
function finish(){const mx=Q.qs.length*2,r=D.L[Q.n]||{};D.L[Q.n]={done:true,latest:Q.pts,best:Math.max(r.best||0,Q.pts),max:mx,date:new Date().toLocaleDateString(),att:(r.att||0)+1,ok:Q.ok,bad:Q.bad,rt:Q.rt,miss:Q.miss};put();tone([523,659,784,1046]);report(Q.n)}
function report(n){const r=D.L[n],l=LS[n-1],pc=Math.round(r.latest/r.max*100);
A.innerHTML=`<div class="rep" style="--c:${l.c}"><h1>${l.ic} Lesson Report</h1><p><b>${E(D.name)}</b><br>Lesson ${n}: ${l.t}</p><div class="big">${pc}%</div><h2>${lv(pc)}</h2><table><tr><td>Questions answered</td><td>${l.q.length}</td></tr><tr><td>Correct answers</td><td>${r.ok}</td></tr><tr><td>Incorrect answers</td><td>${r.bad}</td></tr><tr><td>Corrected after reattempt</td><td>${r.rt}</td></tr><tr><td>Final score</td><td>${r.latest}/${r.max}</td></tr><tr><td>Best score</td><td>${r.best}/${r.max}</td></tr></table><p>${pc>=75?`You understand “${l.t}” very well!`:`Please revise “${l.t}” (${l.pg}).`} ${r.miss.length?`You missed ${r.miss.length} question(s) – see them below and revisit ${l.pg}.`:'No mistakes – amazing!'}</p></div><div id="rv"></div><button class="btn" onclick="rv(${n})">🔍 REVIEW MY ANSWERS</button><button class="btn" onclick="play(${n})">🔁 RETRY THIS LESSON</button><button class="btn g" onclick="menu()">⬅ BACK TO LESSON MENU</button><button class="btn g" onclick="put();toast('Result saved on this device ✔')">💾 SAVE MY RESULT</button><button class="btn g" onclick="window.print()">🖨 Print My Report</button>`}
function rv(n){const m=D.L[n].miss;$('#rv').innerHTML=m.length?m.map(x=>`<div class="fb r"><b>${E(x.q)}</b><br>✔ ${E(x.a)}</div>`).join(''):'<div class="fb g">🎉 No mistakes to review!</div>'}
function unit(){const ds=LS.map((l,i)=>({l,i,r:D.L[i+1]})).filter(d=>d.r&&d.r.done),all=ds.length==6,tot=LS.reduce((a,l)=>a+l.q.length*2,0);let tp=0;ds.forEach(d=>tp+=d.r.latest);const pc=Math.round(tp/tot*100),ps=ds.map(d=>({...d,p:Math.round(d.r.latest/d.r.max*100)})).sort((a,b)=>b.p-a.p),weak=ps.filter(d=>d.p<75);
A.innerHTML=`<div class="rep"><h1>🏆 Unit 2 Performance Report</h1><p><b>${E(D.name)}</b><br>Digital Safety and Security Precautions</p><div class="big">${pc}%</div><h2>${lv(pc)}</h2><table><tr><td>Total points earned</td><td>${tp}</td></tr><tr><td>Total available points</td><td>${tot}</td></tr><tr><td>Completed lessons</td><td>${ds.length}/6</td></tr><tr><td>Best-performing lesson</td><td>${ps[0]?'L'+(ps[0].i+1)+' ('+ps[0].p+'%)':'–'}</td></tr><tr><td>Needs most revision</td><td>${ps.length?'L'+(ps[ps.length-1].i+1)+' ('+ps[ps.length-1].p+'%)':'–'}</td></tr></table></div><div class="rep">${LS.map((l,i)=>{const r=D.L[i+1],p=r&&r.done?Math.round(r.latest/r.max*100):0;return `<div class="cr"><span>L${i+1}</span><div class="bar"><i style="width:${p}%;background:${l.c}"></i></div><b>${r&&r.done?p+'%':'–'}</b></div>`}).join('')}<p class="s">${ds.length<6?'Finish all six lessons for the full analysis.':weak.length?'Recommended revision: '+weak.map(d=>`Lesson ${d.i+1} (${d.l.pg})`).join('; '):'Great job – every lesson is 75% or higher!'}</p></div>`+(all?`<div class="certw"><div class="cert"><h2>🏅 UNIT 2 – DIGITAL SAFETY AND SECURITY PRECAUTIONS</h2><p>Awarded to:</p><div class="n">${E(D.name)}</div><p>For successfully completing the ICT challenges.</p><b>ENG.NIHAL BADAWY – ICT GRADE 5</b><br><small>THINK • CREATE • INNOVATE</small></div></div><button class="btn" onclick="document.body.classList.add('pc');window.print();setTimeout(()=>document.body.classList.remove('pc'),800)">🖨 PRINT CERTIFICATE</button>`:`<p class="rep">🔒 Complete all six lessons to unlock your certificate (${6-ds.length} to go).</p>`)+`<button class="btn g" onclick="window.print()">🖨 Print / Save as PDF</button><button class="btn g" onclick="csv()">⬇ Export Scores (CSV)</button><button class="btn g" onclick="menu()">⬅ Back to Menu</button>`}
function csv(){const rows=[['Student','Lesson','Title','Latest','Best','Max','Best %','Completed','Date','Attempts','Correct','Incorrect','Retried']];LS.forEach((l,i)=>{const r=D.L[i+1]||{};rows.push([D.name,i+1,l.t,r.latest??'',r.best??'',l.q.length*2,r.done?Math.round(r.best/r.max*100):'',r.done?'Yes':'No',r.date||'',r.att||0,r.ok??'',r.bad??'',r.rt??''])});
const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='ICT5_Unit2_'+D.name+'.csv';a.click()}
home();
</script></body></html>
